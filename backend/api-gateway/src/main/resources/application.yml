server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: catalog-books
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/books/**
            - id: catalog-categories
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/categories/**
            - id: order-cart
              uri: lb://order-service
              predicates:
                - Path=/api/v1/cart/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${FRONTEND_BASE_URL:http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: '*'
                allow-credentials: false
                max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOSTNAME:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
